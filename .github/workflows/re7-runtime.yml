name: re7-runtime-fast

# Fast boot/import-loop build. Produces only out/bionic (gow3-probe + shared libs),
# not an APK. The expensive FEX/GPU/Atrac9 artifacts come from the base cache and
# only gow3-probe is recompiled. Use android.yml for the full APK.
on:
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild FEX/GPU/Atrac9 instead of reusing the base cache
        type: boolean
        default: false
  push:
    branches: [feat/re7-playable]
    paths:
      - 'src/**'
      - 'cpu/**'
      - 'gpu/**'
      - 'third_party/FEX/**'
      - 'third_party/LibAtrac9/**'
      - 'tools/android/build_bionic*.sh'
      - 'tools/android/build_bionic_deps.sh'
      - 'ci/**'
      - '.github/workflows/re7-runtime.yml'

concurrency:
  group: re7-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PLATFORM: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  runtime:
    name: Build fast Bionic runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore Android SDK package cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/platforms/android-${{ env.ANDROID_PLATFORM }}
            /usr/local/lib/android/sdk/build-tools/${{ env.ANDROID_BUILD_TOOLS }}
            /usr/local/lib/android/sdk/ndk/29.0.14206865
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_PLATFORM }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Set up native dependency environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;29.0.14206865

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm cmake ninja-build meson pkg-config patchelf ccache \
            libxml2-utils unzip xz-utils zstd

      - name: Restore reproducible build caches
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/src
            .local-deps/android/m2
            ~/.cache/ccache
          key: android-${{ runner.os }}-${{ hashFiles('tools/android/**', 'cpu/**', 'gpu/CMakeLists.txt', 'gpu/third_party/**', 'ci/**') }}
          restore-keys: android-${{ runner.os }}-

      - name: Restore Bionic dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .local-deps/android/bionic-prefix
            .local-deps/android/bionic-src
            .local-deps/android/bionic-build
            .local-deps/android/src/bloodframe
          key: bionic-deps-${{ runner.os }}-${{ hashFiles('tools/android/build_bionic_deps.sh', 'ci/environment.yml') }}

      # FEX/GPU objects are not in this cache; the final libraries are. The key
      # deliberately excludes src/** so runtime/probe edits still hit it.
      - name: Restore Bionic base libraries
        uses: actions/cache@v4
        with:
          path: |
            out/bionic/bin
            out/bionic/lib
            out/libatrac9.a
          key: re7-bionic-base-${{ runner.os }}-${{ hashFiles('cpu/**', 'gpu/**', 'third_party/FEX/**', 'third_party/LibAtrac9/**', 'tools/android/build_bionic.sh', 'tools/android/build_bionic_deps.sh', 'ci/environment.yml') }}

      - name: Build pinned host dependencies
        shell: bash -el {0}
        run: bash ci/setup-deps.sh "$CONDA_PREFIX"

      - name: Configure build environment
        shell: bash -el {0}
        run: |
          {
            echo "GOW3_ARM64_HEADERS=$CONDA_PREFIX"
            echo "GOW3_JOBS=$(nproc)"
            echo "GOW3_BUILD_TOOLS=$ANDROID_BUILD_TOOLS"
          } >> "$GITHUB_ENV"
          cmake_dir="$CONDA_PREFIX/lib/cmake"
          boost_dir=$(compgen -G "$cmake_dir/Boost-*/BoostConfig.cmake" | head -1 | xargs dirname || true)
          boost_headers_dir=$(compgen -G "$cmake_dir/boost_headers-*/boost_headers-config.cmake" | head -1 | xargs dirname || true)
          if [[ -n $boost_dir ]]; then
            echo "GOW3_BOOST_DIR=$boost_dir" >> "$GITHUB_ENV"
            echo "GOW3_BOOST_HEADERS_DIR=${boost_headers_dir:-$boost_dir}" >> "$GITHUB_ENV"
          fi

      - name: Choose fast or full build
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          fast=1
          if [[ "${{ inputs.full }}" == "true" ]]; then
            fast=0
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            if [[ -z $base || $base =~ ^0+$ ]]; then
              fast=0
            elif git diff --name-only "$base" HEAD | grep -Eq '^(cpu|gpu|third_party/(FEX|LibAtrac9))/'; then
              fast=0
            fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "build mode: $([[ $fast == 1 ]] && echo fast || echo full)"

      - name: Build fast runtime
        if: steps.mode.outputs.fast == '1'
        shell: bash -el {0}
        run: bash tools/android/build_bionic_fast.sh

      - name: Build full runtime
        if: steps.mode.outputs.fast != '1'
        shell: bash -el {0}
        run: bash tools/android/build_bionic.sh

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: re7-runtime-${{ github.sha }}
          path: |
            out/bionic/bin/gow3-probe
            out/bionic/bin/kgsl-chip-id
            out/bionic/lib/*.so
          if-no-files-found: error
          retention-days: 7
